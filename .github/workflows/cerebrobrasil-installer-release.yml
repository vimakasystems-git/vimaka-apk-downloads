name: CerebroBrasil Installers

on:
  push:
    tags:
      - 'cerebrobrasil-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex: cerebrobrasil-v0.1.0)'
        required: true
        default: 'cerebrobrasil-v0.1.0'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build Android APK (debug-signed)
        working-directory: cerebrobrasil
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CerebroBrasil-Android.apk
          cd ..
          sha256sum CerebroBrasil-Android.apk | awk '{print $1}' > CerebroBrasil-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            cerebrobrasil/CerebroBrasil-Android.apk
            cerebrobrasil/CerebroBrasil-Android.apk.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows installer (Tauri NSIS)
        working-directory: cerebrobrasil
        shell: bash
        run: |
          npx @tauri-apps/cli@2 icon icon-source.png
          npx @tauri-apps/cli@2 build --bundles nsis
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*.exe release/CerebroBrasil-Setup.exe
          (cd release && sha256sum CerebroBrasil-Setup.exe | awk '{print $1}' > CerebroBrasil-Setup.exe.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            cerebrobrasil/release/CerebroBrasil-Setup.exe
            cerebrobrasil/release/CerebroBrasil-Setup.exe.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - name: Build Linux .rpm (Tauri)
        working-directory: cerebrobrasil
        run: |
          npx @tauri-apps/cli@2 icon icon-source.png
          npx @tauri-apps/cli@2 build --bundles rpm
          mkdir -p release
          cp src-tauri/target/release/bundle/rpm/*.rpm release/CerebroBrasil-Linux.rpm
          (cd release && sha256sum CerebroBrasil-Linux.rpm | awk '{print $1}' > CerebroBrasil-Linux.rpm.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            cerebrobrasil/release/CerebroBrasil-Linux.rpm
            cerebrobrasil/release/CerebroBrasil-Linux.rpm.sha256

  release:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Gather assets
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.rpm' -o -name '*.sha256' \) -exec cp {} assets/ \;
          ls -la assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: CerebroBrasil ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: assets/*
