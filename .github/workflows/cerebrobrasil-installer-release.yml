name: CerebroBrasil Installers

on:
  push:
    tags:
      - 'cerebrobrasil-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex: cerebrobrasil-v0.1.0)'
        required: true
        default: 'cerebrobrasil-v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"; else echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi

      - name: Build Android APK (debug-signed)
        working-directory: cerebrobrasil
        shell: bash
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CerebroBrasil-Android.apk
          cd ..
          sha256sum CerebroBrasil-Android.apk | awk '{print $1}' > CerebroBrasil-Android.apk.sha256

      - name: Build Windows installer (Tauri)
        working-directory: cerebrobrasil
        shell: bash
        run: |
          npx @tauri-apps/cli@2 icon icon-source.png
          npx @tauri-apps/cli@2 build
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*.exe release/CerebroBrasil-Setup.exe
          (cd release && sha256sum CerebroBrasil-Setup.exe | awk '{print $1}' > CerebroBrasil-Setup.exe.sha256)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: CerebroBrasil ${{ steps.tag.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: |
            cerebrobrasil/CerebroBrasil-Android.apk
            cerebrobrasil/CerebroBrasil-Android.apk.sha256
            cerebrobrasil/release/CerebroBrasil-Setup.exe
            cerebrobrasil/release/CerebroBrasil-Setup.exe.sha256
